# Minimal MBASIC test configuration.
#
# The one example here that runs against files this repo actually ships.
# Run it from the top of the checkout, because the mappings below are
# relative to the working directory:
#
#   ./src/cpmemu examples/simple_test.cfg
#
# then, in MBASIC:  LOAD "PRINTSEP.BAS"  /  RUN

# MBASIC is not shipped here.  Put a copy at this path or edit the line.
program = ${HOME}/cpm/com/mbasic.com

# Settings first, mappings after.  A mapping captures default_mode and
# eol_convert as they stand on the line it appears on, so a setting written
# below a mapping does not apply to it.
default_mode = text

# The .bas files in tests/ have Unix line endings, which MBASIC has to be
# given as CR LF: without the conversion LOAD "PRINTSEP.BAS" answers "Line
# buffer overflow in 10".
eol_convert = true

debug = false

# default_mode applies to every file MBASIC opens as well as every file it
# makes, so what has to stay binary needs a rule.  A program SAVEd without ,A
# is tokenized - binary - and would be written through the converter and
# read back wrong.  MBASIC reads an ASCII program as well from a binary file,
# CR LF and all, so the rule costs a SAVE "X",A only its host line ends.
# The three mappings below say text on their own line, which beats the rule.
*.BAS = binary

# One CP/M name to one real file.  A '*' on the host side would take the
# matched name instead - "*.BAS = tests/*.bas text" would reach all three -
# but these are spelled out so it is obvious which files the example uses.
PRINTSEP.BAS = tests/printsep.bas text
CIRC10.BAS   = tests/circ10.bas text
LPRINT.BAS   = tests/lprint_test.bas text
