# Example CP/M Emulator Configuration File
# Lines starting with # are comments.
#
# Every directive here is real.  Any key that is NOT one of the directives
# below is treated as a file mapping instead, and a typo therefore produces
# no error - see docs/config_file.md.

# Program to run (required).
# This repo ships no CP/M programs; put your own under ${HOME}/cpm/com/ or
# edit this line.
program = ${HOME}/cpm/com/mbasic.com

# Change to this directory before running, so output files land there.
#
# NOTE: cd takes effect at this line, while it is being read, and 'program'
# is resolved afterwards against the resulting directory.  A relative
# 'program' path written above a cd will not be found.  Keep 'program'
# absolute, or put cd first and mean it.
cd = /tmp

# text, binary or auto: the mode of every file the program opens or makes
# that no mapping or mode rule (below) names.  auto guesses from the
# extension and, for a name on the text list, from what the file holds.
# text or binary applies to the files a program opens too, so give whatever
# must be the other mode a rule: under text, *.COM = binary and the like.
default_mode = auto

# Convert CP/M's \r\n to the host's \n, and back, for files in text mode.
# A text file a program writes reaches the host all \n, whatever line ends
# it had before.  false keeps CP/M's bytes - \r\n and ^Z - on the host.
eol_convert = true

# Print file mappings, BDOS calls and file operations to stderr.
debug = false

# Whether five ^C in quick succession quit the emulator.  On by default.
# WordStar binds ^C to page-down, so turn it off for WordStar-like programs.
# The --ctrl-c-exit / --no-ctrl-c-exit flags outrank this.
ctrl_c_exit = true

# What a console status call answers once redirected input has ended (stdin
# from a file, /dev/null or a pipe).  true, the default: "no key", as a
# terminal nobody types on does, so a program that looks for ^C between
# pieces of work runs to its end.  A program that waits for a key still learns
# that input has ended.  false: "a key is ready", as before; a ^C check
# then reads past the end of input, and the run stops part way.
# The --eof-idle / --no-eof-idle flags outrank this.
eof_idle = true

# Drives: drive_A through drive_P back a CP/M drive letter with a host
# directory.  A configured drive is confined to its directory - B:GONE.TXT
# fails rather than falling back to the working directory and opening
# something else.  An unconfigured drive IS the working directory, which is
# how every letter behaved before drives existed, so leaving these out
# changes nothing.
#
# drive_A = ${HOME}/cpm/work
# drive_B = ${HOME}/cpm/basic

# File mappings: CPM_NAME = unix/path [text|binary]
# The Unix side is a path and must exist.  A '*' in it takes the text the
# CP/M pattern matched, so "*.BAS = bas/*.bas" sends TEST.BAS to bas/test.bas.
# A value that is only a mode - a mode rule - sets the mode wherever the file
# is found, and beats default_mode.
#
# TEST.BAS = ${HOME}/cpm/bas/test.bas text
# *.BAS    = ${HOME}/cpm/bas/*.bas text
# *.DAT    = binary

# A CP/M name with no mapping is looked up lowercased in the working
# directory, so cd'ing into a directory of files is how you reach a whole
# directory of them.

# Device redirection (optional)
# printer    = ${HOME}/output/printer.txt
# aux_input  = ${HOME}/input/data.txt
# aux_output = ${HOME}/output/auxout.txt
