# Example CP/M Emulator Configuration File
# Lines starting with # are comments.
#
# Every directive here is real.  Any key that is NOT one of the directives
# below is treated as a file mapping instead, and a typo therefore produces
# no error - see examples/README.md.

# Program to run (required).
# This repo ships no CP/M programs; put your own under ${HOME}/cpm/com/ or
# edit this line.
program = ${HOME}/cpm/com/mbasic.com

# Change to this directory before running, so output files land there.
#
# NOTE: cd takes effect at this line, while it is being read, and 'program'
# is resolved afterwards against the resulting directory.  A relative
# 'program' path written above a cd will not be found.  Keep 'program'
# absolute, or put cd first and mean it.
cd = /tmp

# auto, text or binary.  This is how you set the mode for files generally;
# there is no per-extension mode directive.
default_mode = auto

# Convert Unix \n <-> CP/M \r\n for files in text mode.
eol_convert = true

# Print file mappings, BDOS calls and file operations to stderr.
debug = false

# Whether five ^C in quick succession quit the emulator.  On by default.
# WordStar binds ^C to page-down, so turn it off for WordStar-like programs.
# The --ctrl-c-exit / --no-ctrl-c-exit flags outrank this.
ctrl_c_exit = true

# File mappings: CPM_NAME = unix/path [text|binary]
# The Unix side is one literal path and must exist.  There is no wildcard
# substitution, and a value with no path (for example "*.BAS = text") does
# nothing at all.
#
# TEST.BAS = ${HOME}/cpm/bas/test.bas text
# *.DAT    = ${HOME}/cpm/data/records.dat binary

# A CP/M name with no mapping is looked up lowercased in the working
# directory, so cd'ing into a directory of files is how you reach a whole
# directory of them.

# Device redirection (optional)
# printer    = ${HOME}/output/printer.txt
# aux_input  = ${HOME}/input/data.txt
# aux_output = ${HOME}/output/auxout.txt
