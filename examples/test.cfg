# Minimal config for checking environment expansion and cd.
# Run with debug on to see what the parser made of each line.

debug = true
cd = /tmp

# ${VAR} and $VAR are expanded in every value.  An unset variable expands to
# nothing, so a wrong name here fails with a message naming the short path.
program = ${HOME}/cpm/com/mbasic.com

default_mode = auto
eol_convert = true
