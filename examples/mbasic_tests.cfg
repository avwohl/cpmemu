# Run MBASIC against a directory of BASIC programs.
#
# There is no per-drive mapping in this emulator - drive_A / drive_B are not
# directives, and writing them only creates a file mapping for a CP/M file
# literally named DRIVE_A.  The working idiom is to cd into the directory
# you want and let unmapped names be found there: a CP/M name with no
# mapping is looked up lowercased in the working directory.

# MBASIC is not shipped here.  Put a copy at this path or edit the line.
# Keep this absolute: cd below would otherwise change what it resolves against.
program = ${HOME}/cpm/com/mbasic.com

# The directory of BASIC programs.  STARTREK.BAS in MBASIC will find
# startrek.bas here with no mapping needed.
cd = ${HOME}/cpm/bas

# Anything reached that way is BASIC source.
default_mode = text

# Set true if your .bas files have Unix line endings and need converting.
eol_convert = false

# Individual programs that live outside the directory above need an exact
# mapping each, because the Unix side of a mapping is one literal path.
# STARTREK.BAS = ${HOME}/cpm/games/superstartrek.bas text
# BUDGET.BAS   = ${HOME}/cpm/library/business/budget.bas text

debug = false
