# Run MBASIC against a directory of BASIC programs.
#
# Drive B: holds the programs, so LOAD "B:STARTREK.BAS" reaches them and
# DIR B: lists them.  A: stays on the working directory for anything the
# session writes out.

# MBASIC is not shipped here.  Put a copy at this path or edit the line.
program = ${HOME}/cpm/com/mbasic.com

drive_A = .
drive_B = ${HOME}/cpm/bas

# Everything on either drive is BASIC source, or data a program writes and
# reads back as text.
default_mode = text

# The .bas files have CP/M line endings, so nothing is converted, and a file
# reaches the host as MBASIC wrote it.  Text then only makes a sequential
# read stop at the first ^Z.
eol_convert = false

debug = false

# default_mode applies to every file MBASIC opens as well as every file it
# makes, so what has to stay binary needs a rule.  A program SAVEd without ,A
# is tokenized - binary, and it can hold a ^Z, where a text read would stop.
# MBASIC stops an ASCII program at its ^Z itself, so binary loses nothing
# there.  (MBASIC opens no .COM, .OVR or .REL; a config for a program that
# does, under default_mode = text, gives those binary rules too.)
*.BAS = binary

# For .bas files with Unix line endings, set eol_convert = true, make the
# rule above *.BAS = text, and SAVE with ,A: a tokenized save would go
# through the converter as well.  default_mode = auto tells an ASCII program
# from a tokenized one by what the file holds, instead.

# A program kept outside those directories needs an exact mapping each,
# because the Unix side of a mapping is one literal path.
# STARTREK.BAS = ${HOME}/cpm/games/superstartrek.bas text
