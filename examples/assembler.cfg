# M80/L80 assembler workflow.
#
# Source on B:, output on A:, which is the workflow M80 expects.  A drive
# letter is a host directory; a configured drive is confined to it, so a
# missing source file fails instead of quietly resolving somewhere else.

# M80 is not shipped here.  Put a copy at this path or edit the line.
program = ${HOME}/cpm/com/m80.com

# A: takes the listings and .REL output, B: holds the .MAC sources.
drive_A = ${HOME}/cpm/asm/out
drive_B = ${HOME}/cpm/asm/src

default_mode = auto
eol_convert = true
debug = false

# A file kept outside either drive needs an exact mapping.  The Unix side is
# one literal path - no directories, no wildcards.
# SYSLIB.REL = ${HOME}/cpm/lib/syslib.rel binary

# To assemble:
#   1. put the source in ${HOME}/cpm/asm/src/myfile.mac
#   2. run: cpmemu examples/assembler.cfg
#   3. in M80: A:MYFILE=B:MYFILE
# Listings and .REL land in ${HOME}/cpm/asm/out.
