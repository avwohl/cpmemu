# M80/L80 assembler workflow.
#
# Earlier versions of this file mapped source to drive B: and output to
# drive A:.  There is no per-drive mapping in this emulator, so the workflow
# is instead: cd into the directory holding the source, and let M80 read and
# write there.  Unmapped CP/M names are looked up lowercased in the working
# directory, which is what makes this work.

# M80 is not shipped here.  Put a copy at this path or edit the line.
# Absolute, because the cd below would otherwise change what it resolves against.
program = ${HOME}/cpm/com/m80.com

# Source in, listings and .REL out, all in one directory.
cd = ${HOME}/cpm/asm

# .MAC and .PRN are text; .REL and .COM are binary.  There is no
# per-extension mode directive, so pick the mode that suits most of what you
# touch and override individual files with an exact mapping below.
default_mode = auto
eol_convert = true

# An individual file kept elsewhere needs an exact mapping:
# SYSLIB.REL = ${HOME}/cpm/lib/syslib.rel binary

# To assemble:
#   1. put the source in ${HOME}/cpm/asm/myfile.mac
#   2. run: cpmemu examples/assembler.cfg
#   3. in M80: MYFILE=MYFILE
# Output lands next to the source.

debug = false
