# Hi-Tech C workflow.
#
# As with assembler.cfg: there is no per-drive mapping, so source, includes
# and build output all live in one directory that this config cd's into.
# Unmapped CP/M names are found there, lowercased.

# The compiler is not shipped here.  Put a copy at this path or edit the line.
program = ${HOME}/cpm/com/c.com

# Source in, .OBJ and .COM out, one directory.
cd = ${HOME}/cpm/c

default_mode = auto
eol_convert = true

# Headers or libraries kept outside that directory need one exact mapping
# each - the Unix side of a mapping is a single literal path, not a
# directory and not a wildcard.
# STDIO.H = ${HOME}/cpm/c/include/stdio.h text
# LIBC.LIB = ${HOME}/cpm/c/lib/libc.lib binary

debug = false
