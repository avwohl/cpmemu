# Hi-Tech C workflow.
#
# Build output on A:, source on B:, headers and libraries on C: - the usual
# three-drive layout for a CP/M compiler.

# The compiler is not shipped here.  Put a copy at this path or edit the line.
# Hi-Tech C 3.09-19's C.COM driver calls BDOS 102, a CP/M 3 call, and its
# $EXEC stops with "Fmt err", so the driver does not run here; its passes run
# one at a time with these settings.
program = ${HOME}/cpm/com/c.com

drive_A = ${HOME}/cpm/c/build
drive_B = ${HOME}/cpm/c/src
drive_C = ${HOME}/cpm/c/include

# auto guesses each file's mode from its name and, for a name on the text
# list, what it holds.  text or binary would apply to every file the compiler
# opens as well as makes, so its libraries and objects would need binary rules.
default_mode = auto
eol_convert = true
debug = false

# A library kept outside those three needs an exact mapping.
# LIBC.LIB = ${HOME}/cpm/c/lib/libc.lib binary
