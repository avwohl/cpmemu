# HI-TECH C workflow.
#
# Build output on A:, source on B:, the compiler on C:.  Measured with the
# C.COM driver of HI-TECH C 3.09-17 and of 3.09-21: it runs every pass, and
# the programs it makes run.

# HI-TECH C is not shipped here.  Make the directories that this file names:
#   mkdir -p ${HOME}/cpm/com ${HOME}/cpm/c/build ${HOME}/cpm/c/src ${HOME}/cpm/c/hitech
# Get the compiler from https://github.com/agn453/HI-TECH-Z80-C and copy every
# file of its dist/ folder into the drive_C directory.  Copy
# dist/C309-21.COM, the driver, to this path as c.com.
program = ${HOME}/cpm/com/c.com

drive_A = ${HOME}/cpm/c/build
drive_B = ${HOME}/cpm/c/src
drive_C = ${HOME}/cpm/c/hitech

# auto guesses each file's mode from its name and, for a name on the text
# list, what it holds.  text or binary would apply to every file the compiler
# opens as well as makes, so its libraries and objects would need binary rules.
default_mode = auto
eol_convert = true
debug = false

# The driver looks for its passes, libraries, headers and CRTCPM.OBJ on the
# current drive, which is A:, unless the variable HITECH names a drive.  On
# CP/M 2.2 HI-TECH's getenv() reads its variables from a file named ENVIRON
# on the current drive.  This line takes that file from the compiler's
# directory.  Make the file once:
#   echo HITECH=0:C: > ${HOME}/cpm/c/hitech/environ
# Without the file the driver stops with "Can't execute $EXEC".
ENVIRON = ${HOME}/cpm/c/hitech/environ text

# The driver does not look on B: for a header of the program's own:
# #include "sieve.h" fails with "Can't find include file".  This line finds a
# header in the source directory first.  A header there with the name of a
# HI-TECH header is used in place of the HI-TECH header.
*.H = ${HOME}/cpm/c/src/*.h text

# A library kept outside those three needs an exact mapping.
# LIBF.LIB = ${HOME}/cpm/c/lib/libf.lib binary

# Compile B:SIEVE.C to SIEVE.COM on A:.  -O optimizes, -LF links the
# floating-point library:
#   cpmemu examples/compiler.cfg B:SIEVE.C
#   cpmemu examples/compiler.cfg -O B:SIEVE.C -LF
# A compile that works prints the banner and then "BIOS WBOOT called -
# exiting", and nothing between them.  Run the program that the compile makes:
#   cpmemu ${HOME}/cpm/c/build/sieve.com
#
# stdin can be the terminal, a file, /dev/null or a pipe.  Each pass looks for
# ^C while it reads and writes files: BDOS 11, then BDOS 1 when BDOS 11 says
# that a key is ready.  Once redirected input has ended, cpmemu answers those
# checks "no key" (eof_idle, on by default).  With eof_idle = false, each check
# reads past the end of input, cpmemu stops the run after 1024 of those reads,
# and the link leaves a .COM that does not run.  See "End of redirected input"
# in docs/CPM_SUPPORT.md.
#
# cpmemu exits 0 when the compile works and when the compile fails.  Read the
# compiler's messages.
