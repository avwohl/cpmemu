name: Build and Release Packages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        default: '0.0.1'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            rpm_arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            rpm_arch: aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update || (sleep 30 && sudo apt-get update) || (sleep 60 && sudo apt-get update)
          sudo apt-get install -y build-essential ruby ruby-dev rubygems rpm
          sudo gem install fpm

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # For push events, use date + short SHA
            VERSION="0.0.0+$(date +%Y%m%d).${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build cpmemu and libraries
        run: |
          cd src
          make clean || true
          make STATIC=1
          make libs
          make qkz80.pc PREFIX=/usr

      - name: Create staging directory
        run: |
          mkdir -p staging/usr/bin
          mkdir -p staging/usr/lib
          mkdir -p staging/usr/lib/pkgconfig
          mkdir -p staging/usr/include/qkz80
          mkdir -p staging/usr/share/doc/cpmemu
          cp src/cpmemu staging/usr/bin/
          cp src/libqkz80.a staging/usr/lib/
          cp src/libqkz80.so staging/usr/lib/
          cp src/qkz80.pc staging/usr/lib/pkgconfig/
          cp src/qkz80.h src/qkz80_cpu_flags.h src/qkz80_mem.h \
             src/qkz80_reg_pair.h src/qkz80_reg_set.h src/qkz80_trace.h \
             src/qkz80_types.h staging/usr/include/qkz80/
          cp README.md staging/usr/share/doc/cpmemu/
          cp LICENSE staging/usr/share/doc/cpmemu/

      - name: Build DEB package
        run: |
          fpm -s dir -t deb \
            -n cpmemu \
            -v ${{ steps.version.outputs.version }} \
            -a ${{ matrix.arch }} \
            --description "CP/M BDOS emulator - run CP/M .com files on Linux. Includes libqkz80 Z80/8080 emulator library." \
            --url "https://github.com/${{ github.repository }}" \
            --license "GPL-3.0" \
            --maintainer "Aaron Wohl" \
            -C staging \
            .

      - name: Build RPM package
        run: |
          fpm -s dir -t rpm \
            -n cpmemu \
            -v ${{ steps.version.outputs.version }} \
            -a ${{ matrix.rpm_arch }} \
            --description "CP/M BDOS emulator - run CP/M .com files on Linux. Includes libqkz80 Z80/8080 emulator library." \
            --url "https://github.com/${{ github.repository }}" \
            --license "GPL-3.0" \
            --maintainer "Aaron Wohl" \
            -C staging \
            .

      - name: Create version-less copies for latest download
        run: |
          # Create version-less copies so /releases/latest/download/ URLs work
          cp cpmemu_${{ steps.version.outputs.version }}_${{ matrix.arch }}.deb cpmemu_${{ matrix.arch }}.deb
          cp cpmemu-${{ steps.version.outputs.version }}-1.${{ matrix.rpm_arch }}.rpm cpmemu.${{ matrix.rpm_arch }}.rpm

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: "*.deb"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.rpm_arch }}
          path: "*.rpm"

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.deb
            *.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A job of its own rather than another row in the matrix above.  Every step
  # in that job is Debian and RPM packaging - apt-get, gem install fpm, fpm -t
  # deb, fpm -t rpm, and the versionless .deb/.rpm copies - and not one of them
  # has a macOS counterpart, so a matrix row would mean an `if:` on six steps
  # plus a parallel set of macOS ones in the same job.  Two jobs say what is
  # happening.
  #
  # Its build step is also not the Linux one with the OS swapped.  Three
  # things in that step are Darwin traps and all three were measured here on
  # macOS 27 arm64:
  #
  #   make STATIC=1   cannot link.  The SDK ships no crt0.o and no static libc
  #                   or libc++, so it stops at "ld: library 'crt0.o' not
  #                   found"; src/makefile now refuses the flag outright rather
  #                   than pretending, so this job must not pass it.
  #   libqkz80.so     is not what a macOS build produces any more.  It is
  #                   libqkz80.4.dylib with an unversioned symlink beside it,
  #                   so `cp src/libqkz80.so` would just fail.
  #   the archive     is built by cpack from src/CMakeLists.txt, not staged by
  #                   hand, because there is no fpm target to stage for.
  build-macos:
    runs-on: macos-latest

    # The signing steps below key off this rather than testing `secrets`
    # directly in each `if:`.  A job-level env can read secrets, and a
    # step-level `if:` can read env, so one place decides and six steps agree.
    env:
      HAVE_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # For push events, use date + short SHA
            VERSION="0.0.0+$(date +%Y%m%d).${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Not what builds the artifact - it is what someone building from source
      # runs, and its shared-library rules exist only on this platform, so they
      # should break here rather than in that person's terminal.  No STATIC=1:
      # see above.
      - name: Build with the makefile
        run: |
          make -C src clean || true
          make -C src
          make -C src libs
          ls -l src/libqkz80.a src/libqkz80.dylib src/libqkz80.4.dylib
          otool -D src/libqkz80.dylib
          ./src/cpmemu tests/simple_con.com

      # One universal binary rather than an arm64 runner and an Intel one: it
      # covers both architectures from a single job, and src/CMakeLists.txt
      # already names the archive for both - cpmemu-<version>-Darwin-arm64-
      # x86_64.tar.gz.
      #
      # The archive carries the binary, libqkz80.a and the headers, and no
      # dylib.  A dylib's install name is an absolute path, so shipping one in
      # a tarball a user unpacks wherever they like would hand them a library
      # dyld cannot find; that needs an @rpath layout, which is a bigger change
      # than a release job.
      - name: Build the universal binary
        run: |
          cmake -S src -B build-mac \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build-mac --config Release --parallel
          lipo -info build-mac/cpmemu

      # ------------------------------------------------------------------
      # Signing and notarization.  Everything from here to "Build the release
      # archive" runs only when MACOS_CERTIFICATE_P12 is set, and NONE OF IT
      # HAS EVER RUN: this repository has no Developer ID certificate, so the
      # secrets are absent, every step below is skipped, and the archive is the
      # ad-hoc-signed one it has always been.  It is written down so that
      # acquiring a certificate is the whole of the remaining work rather than
      # the smaller half of it.  docs/macos-signing.md says which secrets to
      # create and how to produce each value.
      #
      # What this buys, and what it does not.  A notarization ticket cannot be
      # stapled to a bare Mach-O executable - stapler takes disk images, flat
      # installer packages and bundles, and Apple's position is that tickets
      # are created for standalone binaries but cannot be attached to them.
      # This release ships one bare binary in a tarball, so it is notarized and
      # unstapled, and Gatekeeper looks the ticket up online.  A user who is
      # online stops needing the `xattr` line in README.md; a user who is
      # offline still needs it.  Making it work offline as well means shipping
      # a .pkg or a .dmg, which changes what the download is and what the
      # install instructions say, and is not a thing to decide inside a
      # release job.
      - name: Import the Developer ID certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          # A random password for a keychain that lives as long as this job
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a GUI prompt no runner can answer
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign the binary
        if: env.HAVE_SIGNING == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          # --options runtime is the hardened runtime, which notarization
          # requires; --timestamp is a secure timestamp, which it also
          # requires.  This replaces the ad-hoc signature clang applies on
          # arm64 rather than adding to it.
          codesign --force --options runtime --timestamp \
                   --sign "$SIGN_IDENTITY" build-mac/cpmemu
          codesign --verify --strict --verbose=2 build-mac/cpmemu

      - name: Notarize
        if: env.HAVE_SIGNING == 'true'
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          # notarytool takes an archive, not a bare executable
          ditto -c -k --keepParent build-mac/cpmemu "$RUNNER_TEMP/cpmemu.zip"
          # --wait, so a rejection fails this job rather than being discovered
          # by whoever downloads the release
          xcrun notarytool submit "$RUNNER_TEMP/cpmemu.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cpmemu.zip"
          # No `stapler staple` here, and not by oversight: see the note above.
          # It would exit 73, "The staple and validate action failed".
          spctl --assess --type execute --verbose=4 build-mac/cpmemu || \
            echo "note: spctl assessed the unstapled binary as above"

      - name: Build the release archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="cpmemu-$VERSION-Darwin-arm64-x86_64"
          ( cd build-mac && cpack -D CPACK_PACKAGE_VERSION="$VERSION" \
                                  -D CPACK_PACKAGE_FILE_NAME="$NAME" )
          mv "build-mac/$NAME.tar.gz" .
          # A versionless copy so /releases/latest/download/ URLs work, as the
          # Linux job does for the .deb and the .rpm
          cp "$NAME.tar.gz" cpmemu-macos-universal.tar.gz
          tar tzf "$NAME.tar.gz"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: "*.tar.gz"

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: "*.tar.gz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  collect:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: List packages
        run: |
          echo "Built packages:"
          find packages -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.tar.gz" \) | sort
