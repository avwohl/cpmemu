# Tests.  The other workflow in here, release.yml, builds and packages; it runs
# no test suite at all, so until this file existed nothing in the tree had been
# checked by a machine other than the one the change was written on.
#
# The point of the windows job is narrower than "run the tests on Windows".
# tests/win_console.cc drives a real console with WriteConsoleInput, and
# src/os/windows/platform.cc is the code it covers.  Neither had ever been
# executed anywhere: the Windows console path was rewritten, cross-compiled and
# shipped without one of its cases reporting a single verdict.  This job is the
# first machine to run them.
#
# Every job passes its suite's "do not skip" switch.  A skip exits 0, so a
# runner missing a tool reports a green tick having run part of the suite - the
# first version of this file did exactly that, running 60 of 102 checks on
# ubuntu because z80asm was not installed, and reporting success.  The tools are
# installed below AND the suites are told to fail on a skip, because installing
# a tool can quietly stop working and a skip would absorb it again.
name: Tests

on:
  push:
    branches: [main, drain-todo]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # z80asm assembles 13 guests at test time; without it 42 checks - about
      # two fifths of the suite - skip.  g++-mingw-w64 is for the cross-compile
      # of src/os/windows/platform.cc, which fails on any warning.
      - name: Install z80asm and the mingw cross-compiler
        run: |
          sudo apt-get update || (sleep 30 && sudo apt-get update)
          sudo apt-get install -y z80asm g++-mingw-w64-x86-64

      - name: Build
        run: make -C src

      - name: Run the test suite
        run: tests/run_tests.sh --require

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The same assembler as the linux job: z80asm 1.8 in both Homebrew and
      # Debian, so the 13 guests are assembled by the same program on both.
      - name: Install z80asm
        run: brew install z80asm

      # No STATIC=1: the macOS SDK ships no crt0.o and src/makefile refuses the
      # flag outright.  release.yml's build-macos job says the same at length.
      - name: Build
        run: make -C src

      # This suite allocates a pty and drives cpmemu through it, which is the
      # only way to reach the termios layer in src/os/linux/platform.cc - the
      # file both POSIX platforms share.  It had been run on macOS by hand and
      # by no machine.
      #
      # --require here too, so a brew install that stops working cannot hide 42
      # checks behind a green tick - the hole this job had until the ubuntu one
      # demonstrated it.  CPMEMU_SKIP_OK allows exactly one skip through:
      # installing a Windows cross-compiler on a Mac to repeat a check the
      # linux job already does would be silly.  The assembler is not on that
      # list and cannot go missing quietly.
      - name: Run the test suite
        env:
          CPMEMU_SKIP_OK: mingw
        run: tests/run_tests.sh --require

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cpmemu.exe with MSVC
        shell: cmd
        run: src\do_build.bat

      # CPMEMU_REQUIRE_MSVC=1 turns win_console.bat's "no compiler" skip and
      # win_console.exe's "no emulator" and "no console to drive" skips into
      # failures.  All three exit 0 otherwise, and on this runner the first of
      # them used to fire: the batch file named one Visual Studio path and this
      # image has another.
      - name: Run the Windows console tests
        shell: cmd
        env:
          CPMEMU_REQUIRE_MSVC: '1'
        run: tests\win_console.bat

  # The instruction exercisers take about 18 minutes for the three of them, so
  # they are not in the linux job above.  On demand, from the Actions tab.
  exercisers:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -C src
      - name: zexdoc, zexall and 8080exm
        run: tests/run_tests.sh --zex
